name: Deploy to Azure Web App

on:
  push:
    branches:
      - master  # o main, según tu rama principal

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: 🧲 Checkout repo
      uses: actions/checkout@v3

    - name: 🧼 Crear carpeta temporal sin /test
      run: |
        powershell -command "
          Remove-Item -Recurse -Force tempDeploy -ErrorAction SilentlyContinue;
          New-Item -ItemType Directory -Path tempDeploy;
          $items = Get-ChildItem -Path . -Exclude 'test','tempDeploy','.git','.github';
          foreach ($item in $items) {
            Copy-Item -Path $item.FullName -Destination 'tempDeploy' -Recurse -Force
        }
        "


    - name: 📦 Crear ZIP
      run: powershell -command "Compress-Archive -Path tempDeploy\* -DestinationPath deploy.zip"

    - name: 🚀 Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: pdgv1979  # nombre exacto de tu Web App
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: deploy.zip  # carpeta raíz del proyecto (donde está informacion.html)

  build-and-test:
    needs: build-and-deploy  # 👈 Esto fuerza a esperar que se complete el job anterior  
    runs-on: windows-latest

    steps:
    - name: 🧲 Checkout repo
      uses: actions/checkout@v3

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x' # ajusta según la versión que uses

    - name: 📦 Restore dependencies
      run: dotnet restore test\testsolu

    - name: 🛠️ Build project
      run: dotnet build test\testsolu --configuration Release

    - name: 🌐 Verificar disponibilidad del sitio
      run: |
          $url = "https://pdgv1979.azurewebsites.net"
          $maxRetries = 5
          $success = $false
          for ($i = 0; $i -lt $maxRetries; $i++) {
          try {
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
          if ($response.StatusCode -eq 200) {
          echo "✅ Sitio disponible."
          $success = $true
          break
          }
          } catch {
          echo "⏳ Esperando sitio... intento $($i+1)"
          Start-Sleep -Seconds 5
          }
          }
           if (-not $success) {
             throw "❌ El sitio no respondió después de $maxRetries intentos."
           }


    - name: 🧪 Run NUnit tests
      run: dotnet test  test\testsolu --no-build --verbosity normal